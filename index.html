<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>🚕 営収管理</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}

.wrap{max-width:520px;margin:auto;padding:18px 16px 90px}

h1{font-size:27px;margin:8px 0 18px}

.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}

label{display:block;font-size:13px;color:#666;margin:12px 0 6px}

input,select{width:100%;font-size:20px;padding:13px 12px;border:1px solid #ddd;border-radius:12px;background:#fafafa}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:700;margin-top:16px;background:#111;color:#fff}

.tabs{display:flex;gap:8px;margin-bottom:10px}

.tab{flex:1;padding:11px;border:0;border-radius:12px;background:#e8e8eb;font-weight:700}

.tab.active{background:#111;color:#fff}

.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}

.num{font-weight:800}

.entry{padding:13px 0;border-bottom:1px solid #eee}

.small{font-size:12px;color:#777}

.danger{background:#fff;color:#c00;border:1px solid #f0caca}

.editbtn{background:#eee;color:#111;border:0;border-radius:9px;padding:7px 12px;margin-top:8px;margin-right:6px}

.deletebtn{background:#fff;color:#c00;border:1px solid #e0b0b0;border-radius:9px;padding:7px 12px}

.empty{text-align:center;color:#888;padding:25px 0}

.monthnav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}

.navbtn{border:0;background:#eee;border-radius:12px;font-size:22px;padding:10px}

</style>

</head>

<body>

<div class="wrap">

<h1>🚕 営収管理</h1>

<div class="tabs">

<button id="tabInput" class="tab active">入力</button>

<button id="tabSummary" class="tab">月間集計</button>

<button id="tabAnnual" class="tab">年間集計</button>

</div>

<section id="inputView" class="card">

<h2 id="formTitle" style="margin-top:0">入力</h2>

<label>日付</label>

<input id="date" type="date">

<label>実質営収（円）</label>

<input id="sales" type="number" inputmode="numeric" placeholder="42800">

<div class="row">

<div>

<label>営業回数（回）</label>

<input id="rides" type="number" inputmode="numeric">

</div>

<div>

<label>走行距離（km）</label>

<input id="km" type="number" inputmode="decimal" step=".1">

</div>

</div>

<label>拘束時間（時間）</label>

<input id="hours" type="number" inputmode="decimal" step=".25">

<button id="save" class="btn">保存する</button>

<button id="cancelEdit" class="btn danger" style="display:none">修正をキャンセル</button>

</section>

<section id="summaryView" class="card" style="display:none">

<h2 style="margin-top:0">月間集計</h2>

<div class="monthnav">

<button class="navbtn" id="prev">‹</button>

<select id="month"></select>

<button class="navbtn" id="next">›</button>

</div>

<div class="stat"><span>実質営収</span><span class="num" id="sumSales">0円</span></div>

<div class="stat"><span>平均営収</span><span class="num" id="avgSales">0円</span></div>

<div class="stat"><span>営業回数</span><span class="num" id="sumRides">0回</span></div>

<div class="stat"><span>走行距離</span><span class="num" id="sumKm">0km</span></div>

<div class="stat"><span>拘束時間</span><span class="num" id="sumHours">0時間</span></div>

<div class="stat"><span>時間営収</span><span class="num" id="hourSales">0円/時</span></div>

<div class="stat"><span>1回営収</span><span class="num" id="rideSales">0円/回</span></div>

<div class="stat"><span>1km営収</span><span class="num" id="kmSales">0円/km</span></div>

</section>

<section id="annualView" class="card" style="display:none">

<h2 style="margin-top:0">年間集計</h2>

<div class="monthnav">

<button class="navbtn" id="prevYear">‹</button>

<select id="year"></select>

<button class="navbtn" id="nextYear">›</button>

</div>

<div class="stat"><span>実質営収</span><span class="num" id="yearSales">0円</span></div>

<div class="stat"><span>月平均営収</span><span class="num" id="yearAvgSales">0円</span></div>

<div class="stat"><span>営業回数</span><span class="num" id="yearRides">0回</span></div>

<div class="stat"><span>走行距離</span><span class="num" id="yearKm">0km</span></div>

<div class="stat"><span>拘束時間</span><span class="num" id="yearHours">0時間</span></div>

<div class="stat"><span>時間営収</span><span class="num" id="yearHourSales">0円/時</span></div>

<div class="stat"><span>1回営収</span><span class="num" id="yearRideSales">0円/回</span></div>

<div class="stat"><span>1km営収</span><span class="num" id="yearKmSales">0円/km</span></div>

</section>

<section class="card">

<h2 style="margin-top:0">履歴</h2>

<div id="history"></div>

<button id="clear" class="btn danger">全データを削除</button>

</section>

</div>

<script>

const $=id=>document.getElementById(id);

const key="taxiEarningsV1";

let data=JSON.parse(localStorage.getItem(key)||"[]");

let d0=new Date();

let currentYM=d0.toISOString().slice(0,7);

let selectedYM=currentYM;

let selectedYear=String(d0.getFullYear());

let editingDate=null;

$("date").value=d0.toISOString().slice(0,10);

function yen(n){

return Math.round(n).toLocaleString()+"円";

}

function buildMonths(){

let s=new Set(data.map(x=>x.date.slice(0,7)));

s.add(currentYM);

s.add(selectedYM);

$("month").innerHTML=[...s]

.sort()

.reverse()

.map(v=>{

let[a,b]=v.split("-");

return `<option value="${v}">${a}年${+b}月</option>`;

})

.join("");

$("month").value=selectedYM;

}

function buildYears(){

let s=new Set(data.map(x=>x.date.slice(0,4)));

s.add(String(d0.getFullYear()));

s.add(selectedYear);

$("year").innerHTML=[...s]

.sort()

.reverse()

.map(v=>`<option value="${v}">${v}年</option>`)

.join("");

$("year").value=selectedYear;

}

function renderYear(){

let m=data.filter(x=>x.date.startsWith(selectedYear));

let ss=m.reduce((a,x)=>a+x.sales,0);

let rr=m.reduce((a,x)=>a+x.rides,0);

let kk=m.reduce((a,x)=>a+x.km,0);

let hh=m.reduce((a,x)=>a+x.hours,0);

let months=new Set(m.map(x=>x.date.slice(0,7))).size;

$("yearSales").textContent=yen(ss);

$("yearAvgSales").textContent=yen(months?ss/months:0);

$("yearRides").textContent=rr+"回";

$("yearKm").textContent=kk+"km";

$("yearHours").textContent=hh+"時間";

$("yearHourSales").textContent=yen(hh?ss/hh:0)+"/時";

$("yearRideSales").textContent=yen(rr?ss/rr:0)+"/回";

$("yearKmSales").textContent=yen(kk?ss/kk:0)+"/km";

}

function render(){

let m=data.filter(x=>x.date.startsWith(selectedYM));

let ss=m.reduce((a,x)=>a+x.sales,0);

let rr=m.reduce((a,x)=>a+x.rides,0);

let kk=m.reduce((a,x)=>a+x.km,0);

let hh=m.reduce((a,x)=>a+x.hours,0);

$("sumSales").textContent=yen(ss);

$("avgSales").textContent=yen(m.length?ss/m.length:0);

$("sumRides").textContent=rr+"回";

$("sumKm").textContent=kk+"km";

$("sumHours").textContent=hh+"時間";

$("hourSales").textContent=yen(hh?ss/hh:0)+"/時";

$("rideSales").textContent=yen(rr?ss/rr:0)+"/回";

$("kmSales").textContent=yen(kk?ss/kk:0)+"/km";

let sorted=[...data].sort((a,b)=>b.date.localeCompare(a.date));

$("history").innerHTML=sorted.length

?sorted.map(x=>`

<div class="entry">

<b>${x.date}</b><br>

${yen(x.sales)}　

${x.rides}回　

${x.km}km　

拘束${x.hours}時間

<br>

<button class="editbtn" onclick="editData('${x.date}')">✏️ 修正</button>

<button class="deletebtn" onclick="deleteData('${x.date}')">🗑️ 削除</button>

</div>

`).join("")

:'<div class="empty">まだ記録がありません</div>';

}

function editData(date){

let x=data.find(y=>y.date===date);

if(!x)return;

editingDate=date;

$("date").value=x.date;

$("sales").value=x.sales;

$("rides").value=x.rides;

$("km").value=x.km;

$("hours").value=x.hours;

$("formTitle").textContent="データを修正";

$("save").textContent="修正を保存";

$("cancelEdit").style.display="block";

window.scrollTo({top:0,behavior:"smooth"});

}

function deleteData(date){

if(!confirm(date+" のデータを削除しますか？"))return;

data=data.filter(x=>x.date!==date);

localStorage.setItem(key,JSON.stringify(data));

buildMonths();

buildYears();

render();

renderYear();

}

$("save").onclick=()=>{

let x={

date:$("date").value,

sales:+$("sales").value||0,

rides:+$("rides").value||0,

km:+$("km").value||0,

hours:+$("hours").value||0

};

if(!x.date||!x.sales){

alert("日付と実質営収を入力してください");

return;

}

if(editingDate){

data=data.filter(y=>y.date!==editingDate);

editingDate=null;

$("formTitle").textContent="入力";

$("save").textContent="保存する";

$("cancelEdit").style.display="none";

}else{

data=data.filter(y=>y.date!==x.date);

}

data.push(x);

data.sort((a,b)=>b.date.localeCompare(a.date));

localStorage.setItem(key,JSON.stringify(data));

selectedYM=x.date.slice(0,7);

$("sales").value="";

$("rides").value="";

$("km").value="";

$("hours").value="";

buildMonths();

buildYears();

render();

renderYear();

alert("保存しました");

};

$("cancelEdit").onclick=()=>{

editingDate=null;

$("formTitle").textContent="入力";

$("save").textContent="保存する";

$("cancelEdit").style.display="none";

$("date").value=d0.toISOString().slice(0,10);

$("sales").value="";

$("rides").value="";

$("km").value="";

$("hours").value="";

};

$("month").onchange=()=>{

selectedYM=$("month").value;

render();

};

$("year").onchange=()=>{

selectedYear=$("year").value;

renderYear();

};

$("prevYear").onclick=()=>{

selectedYear=String(Number(selectedYear)-1);

buildYears();

renderYear();

};

$("nextYear").onclick=()=>{

selectedYear=String(Number(selectedYear)+1);

buildYears();

renderYear();

};

$("prev").onclick=()=>{

let[a,b]=selectedYM.split("-").map(Number);

let d=new Date(a,b-2,1);

selectedYM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

buildMonths();

render();

buildYears();

renderYear();

};

$("next").onclick=()=>{

let[a,b]=selectedYM.split("-").map(Number);

let d=new Date(a,b,1);

selectedYM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

buildMonths();

render();

};

$("tabInput").onclick=()=>{

$("inputView").style.display="block";

$("summaryView").style.display="none";

$("annualView").style.display="none";

$("tabInput").classList.add("active");

$("tabSummary").classList.remove("active");

$("tabAnnual").classList.remove("active");

};

$("tabSummary").onclick=()=>{

$("inputView").style.display="none";

$("summaryView").style.display="block";

$("annualView").style.display="none";

$("tabSummary").classList.add("active");

$("tabInput").classList.remove("active");

$("tabAnnual").classList.remove("active");

buildMonths();

render();

};

$("tabAnnual").onclick=()=>{

$("inputView").style.display="none";

$("summaryView").style.display="none";

$("annualView").style.display="block";

$("tabAnnual").classList.add("active");

$("tabInput").classList.remove("active");

$("tabSummary").classList.remove("active");

buildYears();

renderYear();

};

$("clear").onclick=()=>{

if(confirm("全データを削除しますか？")){

data=[];

localStorage.removeItem(key);

buildMonths();

buildYears();

render();

renderYear();

}

};

buildMonths();

buildYears();

render();

renderYear();

</script>

</body>

</html>
